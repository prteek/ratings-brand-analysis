name: Publish dataset

on:
  push:
    branches: [main]
    paths:
      - data/ratings.csv
      - dataset/**
      - .github/workflows/publish-dataset.yml
  workflow_dispatch:

concurrency:
  group: publish-dataset
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub==2.3.0
      - name: Install the hf-publish extension
        run: hf extensions install prteek/hf-publish
      - name: Upload the ratings and the dataset card
        run: hf publish -m "Deploy ${GITHUB_SHA::7} from GitHub" dataset
