name: Publish Space

on:
  push:
    branches: [main]
    paths:
      - space/**
      - ratings_compare/**
      - publish.toml
      - wait_for_space.py
      - .github/workflows/publish-space.yml
  workflow_dispatch:

concurrency:
  group: publish-space
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the app's dependencies and the hf CLI
        run: pip install -r space/requirements.txt gradio==6.30.0 pandas pytest huggingface_hub==2.3.0
      - name: Test the model and the app's default example
        run: python -m pytest -q
      - name: Install the hf-publish extension
        run: hf extensions install prteek/hf-publish
      - name: Upload to the Space
        run: hf publish -m "Deploy ${GITHUB_SHA::7} from GitHub" space
      - name: Wait until the Space runs the new commit
        run: python wait_for_space.py prteek/ratings-compare
