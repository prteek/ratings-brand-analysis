# The paper as a standalone Quarto project: `quarto render paper` writes paper/_output/ratings-brand-analysis.pdf
# for alphaXiv. Render with the repo's environment: QUARTO_PYTHON=.venv/bin/python.
project:
  type: default
  output-dir: _output
  render:
    - index.qmd

# Executed results are frozen in _freeze/ (tracked): the paper's bootstrap test is unseeded, so re-running
# only happens when the code changes.
execute:
  freeze: auto

format:
  pdf:
    output-file: ratings-brand-analysis
    papersize: a4
    fontsize: 11pt
    geometry:
      - margin=2.5cm
    number-sections: true
    colorlinks: true
    reference-section-title: References
    fig-pos: "htbp"
    fig-format: png
    fig-dpi: 300
    code-block-bg: "#f6f6f6"
    monofont: Menlo  # covers Greek and symbols printed in code output
    monofontoptions:
      - Scale=0.82
    filters:
      - _wide-tables.lua
    include-in-header:
      text: |
        \usepackage{adjustbox}
        % wrap long lines in code and console output instead of running past the margin
        \usepackage{fvextra}
        \AtBeginDocument{%
          \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,breakanywhere,commandchars=\\\{\}}%
          \RecustomVerbatimEnvironment{verbatim}{Verbatim}{breaklines,breakanywhere}}
        % fit wide tables to the page
        \AtBeginEnvironment{longtable}{\footnotesize\setlength{\tabcolsep}{3pt}}
