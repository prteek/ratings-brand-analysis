[project]
name = "ratings-brand-analysis"
version = "0.1.0"
description = "Is one product really rated better? Beta-binomial comparison of star ratings: blog post, app and dataset"
requires-python = ">=3.12"
# the shared package (ratings_compare): model and data
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
]

[dependency-groups]
# the Gradio Space (space)
app = [
    "gradio>=6.30.0",
    "huggingface-hub>=0.30",
    "plotly>=5.24",
]
# rendering the Quarto blog post (blog/)
blog = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "seaborn>=0.13",
    "tabulate>=0.9",
]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["app", "blog", "dev"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ratings_compare"]
